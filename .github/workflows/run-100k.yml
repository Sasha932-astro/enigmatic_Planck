name: Run 100 K experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-100k.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Prepare extended experiment
        run: python -c "from pathlib import Path; s=Path('experiment_100K.py').read_text(); s=s.replace('T_QS, T_FEATURE = 5800, 5700','T_QS, T_FEATURE = 4700, 4600').replace('T_PLANCK = 5780.0','T_PLANCK = 4700.0').replace('LO, HI = 400.0, 1600.0','LO, HI = 400.0, 160000.0').replace('_100K_case','_100K_4700_ext_case').replace('_100K_overlay.png','_100K_4700_ext_ratio_full.png').replace('Planck(5780 K)','Planck(4700 K)').replace('ylim=(0.6, 1.4)','ylim=(0.0, 1.6)').replace('fig, ax = plt.subplots(figsize=(10, 6))','fig, ax = plt.subplots(figsize=(10, 6))\\n    ax.set_xscale(\\\"log\\\")'); Path('experiment_100K_4700_ext.py').write_text(s)"
      - name: Run extended experiment
        run: python experiment_100K_4700_ext.py | tee scenarios/_100K_4700_ext_results.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-100K-4700-extended
          path: |
            scenarios/_100K_4700_ext_caseA.png
            scenarios/_100K_4700_ext_caseB.png
            scenarios/_100K_4700_ext_ratio_full.png
            scenarios/_100K_4700_ext_results.txt
          if-no-files-found: error
