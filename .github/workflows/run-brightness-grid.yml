name: Brightness temperature grid
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-brightness-grid.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract wavelength and mu=1 intensity
        run: |
          mkdir -p brightness_grid
          awk '$1>=600 && $1<=3000 {print $1, $2}' mps_atlas/set1/MH0.0/teff5800/logg4.4/mpsa_intensity_spectra.dat > brightness_grid/5800.txt
          awk '$1>=600 && $1<=3000 {print $1, $2}' mps_atlas/set1/MH0.0/teff5600/logg4.4/mpsa_intensity_spectra.dat > brightness_grid/5600.txt
          awk '$1>=600 && $1<=3000 {print $1, $2}' mps_atlas/set1/MH0.0/teff5400/logg4.4/mpsa_intensity_spectra.dat > brightness_grid/5400.txt
          awk '$1>=600 && $1<=3000 {print $1, $2}' mps_atlas/set1/MH0.0/teff5200/logg4.4/mpsa_intensity_spectra.dat > brightness_grid/5200.txt
          awk '$1>=600 && $1<=3000 {print $1, $2}' mps_atlas/set1/MH0.0/teff5000/logg4.4/mpsa_intensity_spectra.dat > brightness_grid/5000.txt
      - uses: actions/upload-artifact@v4
        with:
          name: brightness-temperature-inputs
          path: brightness_grid/*.txt
