name: Run full MPS vs MURaM comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-full-comparison.yml'
      - 'experiment_full_comparison.py'
      - 'experiment_100K.py'
      - 'model.ipynb'
      - 'mps_download.py'
      - 'mps_atlas/set1/MH0.0/teff5700/logg4.4/mpsa_intensity_spectra.dat'
      - 'mps_atlas/set1/MH0.0/teff5800/logg4.4/mpsa_intensity_spectra.dat'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib h5py
      - name: Rerun canonical 100 K experiment
        run: python experiment_100K.py | tee scenarios/_100K_results_fresh.txt
      - name: Run full comparison from source spectra
        run: python experiment_full_comparison.py | tee scenarios/_compare_full_results.txt
      - name: Upload all fresh results
        uses: actions/upload-artifact@v4
        with:
          name: full-mps-muram-comparison
          path: |
            scenarios/_100K_caseA.png
            scenarios/_100K_caseB.png
            scenarios/_100K_overlay.png
            scenarios/_100K_results_fresh.txt
            scenarios/_compare_caseA_a.png
            scenarios/_compare_caseA_ratio.png
            scenarios/_compare_caseB_a.png
            scenarios/_compare_caseB_ratio.png
            scenarios/_compare_full_arrays.npz
            scenarios/_compare_full_results.json
            scenarios/_compare_full_results.txt
          if-no-files-found: error
